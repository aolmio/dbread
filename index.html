<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gold Inventory Pro PWA</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <style>
        :root {
            --bg-body: #f4f7f6; --bg-card: #ffffff; --text-main: #2d3436;
            --accent-smith: #d35400; --accent-sale: #27ae60; --border-color: #dfe6e9;
        }
        [data-theme="dark"] {
            --bg-body: #0e1117; --bg-card: #1d2127; --text-main: #e1e1e1;
            --border-color: #30363d; --accent-smith: #ffb700; --accent-sale: #00e676;
        }

        body { background-color: var(--bg-body); color: var(--text-main); font-family: sans-serif; transition: 0.3s; padding-bottom: 30px; }
        .metric-card { background: var(--bg-card); padding: 1.2rem; border-radius: 12px; border: 1px solid var(--border-color); height: 100%; text-align: center; }
        .metric-value { font-size: 1.2rem; font-weight: 700; }
        .metric-label { font-size: 0.75rem; opacity: 0.7; text-transform: uppercase; }

        .search-container { position: sticky; top: 0; z-index: 100; background: var(--bg-body); padding: 10px 0; border-bottom: 1px solid var(--border-color); }
        .table-container { background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border-color); margin-top: 15px; }
        
        .smith-text { color: var(--accent-smith); font-weight: 600; }
        .sale-text { color: var(--accent-sale); font-weight: 600; }
        
        #drop-area { border: 2px dashed #999; border-radius: 15px; padding: 30px; text-align: center; background: var(--bg-card); cursor: pointer; }
        .hidden { display: none !important; }
        tr { cursor: pointer; user-select: none; }
        th { cursor: pointer; background-color: rgba(0,0,0,0.05) !important; }
        th:hover { background-color: rgba(0,0,0,0.1) !important; }
    </style>
</head>
<body>

<div class="container py-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">💍 Gold Inventory Pro</h4>
        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="theme-switch">
        </div>
    </div>

    <div id="drop-area" class="mb-4">
        <p class="mb-0">📁 Tap to Upload <code>gold_stock.db</code></p>
        <input type="file" id="db-upload" class="hidden" accept=".db">
    </div>

    <div id="app-content" class="hidden">
        <div class="search-container mb-3">
            <input type="text" id="search-input" class="form-control mb-2" placeholder="Search item, code, or goldsmith...">
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="chart-toggle">
                <label class="form-check-label ms-1" for="chart-toggle">Analytics</label>
            </div>
        </div>

        <div class="row g-2 mb-4">
            <div class="col-4 col-md-2"><div class="metric-card"><div class="metric-label">Items</div><div class="metric-value" id="m-unique">-</div></div></div>
            <div class="col-4 col-md-2"><div class="metric-card"><div class="metric-label">Stock</div><div class="metric-value" id="m-qty">-</div></div></div>
            <div class="col-4 col-md-3"><div class="metric-card"><div class="metric-label">Total Grams</div><div class="metric-value" id="m-grams">-</div></div></div>
            <div class="col-12 col-md-5"><div class="metric-card"><div class="metric-label">Burmese Total</div><div class="metric-value" id="m-weight">-</div></div></div>
        </div>

        <div id="chart-section" class="row g-3 mb-4 hidden">
            <div class="col-md-6"><div class="metric-card"><div id="chart-cat"></div></div></div>
            <div class="col-md-6"><div class="metric-card"><div id="chart-smith"></div></div></div>
        </div>

        <div class="table-container">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Item/Code</th>
                            <th onclick="toggleSort('weight_gram')">Grams ⇅</th>
                            <th>Net (B)</th>
                            <th>Smith Wage</th>
                            <th>Sale Profit</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="itemModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="background: var(--bg-card); color: var(--text-main);">
            <div class="modal-header border-0"><h5 class="modal-title">Item Detail</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body" id="modal-content"></div>
        </div>
    </div>
</div>

<script>
    let db = null, fullData = [], currentSort = { key: 'weight_gram', asc: false };

    function formatBW(k, p, y) {
        let res = [];
        if (k > 0) res.push(`${Math.floor(k)}ကျပ်`);
        if (p > 0) res.push(`${Math.floor(p)}ပဲ`);
        if (y > 0) res.push(`${y}ရွေး`);
        return res.length > 0 ? res.join(" ") : "0";
    }

    function getBurmeseTotal(data) {
        let tk = data.reduce((s, r) => s + (parseFloat(r.Net_Kyat) || 0), 0);
        let tp = data.reduce((s, r) => s + (parseFloat(r.Net_Pe) || 0), 0);
        let ty = data.reduce((s, r) => s + (parseFloat(r.Net_Yway) || 0), 0);
        tp += Math.floor(ty / 8); ty %= 8;
        tk += Math.floor(tp / 16); tp %= 16;
        return `${Math.floor(tk)} ကျပ် ${Math.floor(tp)} ပဲ ${ty.toFixed(2)} ရွေး`;
    }

    const config = { locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${f}` };
    document.getElementById('drop-area').onclick = () => document.getElementById('db-upload').click();
    document.getElementById('db-upload').onchange = async (e) => {
        const SQL = await initSqlJs(config);
        const reader = new FileReader();
        reader.onload = () => {
            db = new SQL.Database(new Uint8Array(reader.result));
            loadDB();
            document.getElementById('drop-area').classList.add('hidden');
            document.getElementById('app-content').classList.remove('hidden');
        };
        reader.readAsArrayBuffer(e.target.files[0]);
    };

    function loadDB() {
        const stmt = db.prepare("SELECT * FROM items");
        fullData = [];
        while(stmt.step()) {
            let r = stmt.getAsObject();
            fullData.push({ ...r, 
                Net_Kyat: r['Net (ကျပ်) Net_kyat'] || 0, 
                Net_Pe: r['Net (ပဲ) Net_pae'] || 0, 
                Net_Yway: r['Net (ရွေး) Net_yway'] || 0 
            });
        }
        render(fullData);
    }

    function toggleSort(key) {
        currentSort.asc = currentSort.key === key ? !currentSort.asc : false;
        currentSort.key = key;
        render(fullData);
    }

    function render(data) {
        const term = document.getElementById('search-input').value.toLowerCase();
        let filtered = data.filter(i => 
            String(i.item_code).toLowerCase().includes(term) || 
            String(i.item_name).toLowerCase().includes(term) ||
            String(i.goldsmith_id).toLowerCase().includes(term)
        );

        filtered.sort((a, b) => {
            let vA = parseFloat(a[currentSort.key]) || 0;
            let vB = parseFloat(b[currentSort.key]) || 0;
            return currentSort.asc ? vA - vB : vB - vA;
        });

        document.getElementById('m-unique').innerText = filtered.length;
        document.getElementById('m-qty').innerText = filtered.reduce((s, r) => s + (r.qty_on_hand || 0), 0);
        document.getElementById('m-grams').innerText = filtered.reduce((s, r) => s + (parseFloat(r.weight_gram) || 0), 0).toFixed(3) + " g";
        document.getElementById('m-weight').innerText = getBurmeseTotal(filtered);

        document.getElementById('table-body').innerHTML = filtered.map(i => `
            <tr ondblclick="showDetail('${i.item_code}')">
                <td><small>${i.item_code}</small><br><strong>${i.item_name}</strong></td>
                <td>${i.weight_gram} g</td>
                <td><small>${formatBW(i.Net_Kyat, i.Net_Pe, i.Net_Yway)}</small></td>
                <td class="smith-text">${formatBW(i.smith_wage_kyat, i.smith_wage_pe, i.smith_wage_ywe)}</td>
                <td class="sale-text">${formatBW(i.sale_wage_profit_kyat, i.sale_wage_profit_pe, i.sale_wage_profit_ywe)}</td>
            </tr>
        `).join('');
        renderCharts(filtered);
    }

    function showDetail(code) {
        const i = fullData.find(x => x.item_code === code);
        document.getElementById('modal-content').innerHTML = `
            <div class="p-2">
                <p><strong>Item Code:</strong> ${i.item_code}</p>
                <p><strong>Name:</strong> ${i.item_name}</p>
                <p><strong>Goldsmith:</strong> ${i.goldsmith_id}</p>
                <p><strong>Category:</strong> ${i.category}</p>
                <p><strong>Purity:</strong> ${i.purity}</p>
                <p><strong>Location:</strong> ${i.location}</p>
                <hr>
                <p><strong>Status:</strong> ${i.status}</p>
                <p><strong>Notes:</strong> ${i.notes || '-'}</p>
            </div>
        `;
        new bootstrap.Modal(document.getElementById('itemModal')).show();
    }

    function renderCharts(data) {
        const layout = { height: 250, margin: {t:30, b:30, l:30, r:10}, paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)', font: { size: 10, color: document.documentElement.getAttribute('data-theme') === 'dark' ? '#fff' : '#333' } };
        
        // Category Chart
        const cats = [...new Set(data.map(i => i.category || 'Other'))];
        const catVals = cats.map(c => data.filter(i => i.category === c).reduce((s, r) => s + r.qty_on_hand, 0));
        Plotly.newPlot('chart-cat', [{ x: cats, y: catVals, type: 'bar', marker: {color: '#27ae60'} }], { ...layout, title: 'Qty by Category' });

        // Goldsmith Chart
        const smiths = [...new Set(data.map(i => i.goldsmith_id || 'Unknown'))];
        const smithWeights = smiths.map(s => data.filter(i => i.goldsmith_id === s).reduce((sum, r) => sum + parseFloat(r.weight_gram), 0));
        Plotly.newPlot('chart-smith', [{ values: smithWeights, labels: smiths, type: 'pie', hole: 0.4 }], { ...layout, title: 'Weight by Goldsmith' });
    }

    document.getElementById('search-input').oninput = () => render(fullData);
    document.getElementById('chart-toggle').onchange = (e) => document.getElementById('chart-section').classList.toggle('hidden', !e.target.checked);
    document.getElementById('theme-switch').onchange = (e) => {
        document.documentElement.setAttribute('data-theme', e.target.checked ? 'dark' : 'light');
        render(fullData);
    };
</script>
</body>
</html>
