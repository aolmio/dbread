<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Gold Inventory Pro — Enterprise Edition</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    :root{
      --bg:#f6f8fb;--card:#fff;--text:#111827;--muted:#6b7280;
      --border:#e5e7eb;--primary:#2563eb;--net:#2563eb;--smith:#d97706;
      --profit:#16a34a;--shadow:0 8px 30px rgba(0,0,0,.08)
    }
    [data-theme='dark']{
      --bg:#0f172a;--card:#1e293b;--text:#f8fafc;--muted:#cbd5e1;
      --border:#334155;--shadow:0 8px 30px rgba(0,0,0,.35)
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;transition:.25s}
    .cardx,.modal-content,.table,.table td,.table th,.form-control,.drop{
      background:var(--card)!important;color:var(--text)!important;border-color:var(--border)!important
    }
    .modal-content,.cardx{border-radius:18px;box-shadow:var(--shadow)}
    .sticky-topbar{position:sticky;top:0;z-index:1000;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);padding-top:.5rem}
    .metric{padding:1.2rem;text-align:center;height:100%}
    .metric .v{font-weight:900;font-size:clamp(1.4rem,4vw,2.4rem);line-height:1.1;color:var(--primary)}
    .metric .l{font-size:.95rem;font-weight:700;color:var(--muted);text-transform:uppercase}
    .drop{border:2px dashed var(--border);border-radius:20px;padding:3rem 1rem;text-align:center;cursor:pointer}
    .tags{display:flex;gap:.5rem;overflow:auto;padding:.4rem 0;scrollbar-width:none}.tags::-webkit-scrollbar{display:none}
    .tag{padding:.55rem 1rem;border:1px solid var(--primary);border-radius:999px;white-space:nowrap;cursor:pointer;font-size:1rem}
    .tag.active{background:var(--primary);color:#fff}
    .badge-pill{min-width:80px;font-size:.88rem;padding:.45rem .6rem;word-break:break-word;white-space:normal;text-align:center;line-height:1.3}
    .net-badge{background:var(--net)!important}
    .smith-badge{background:var(--smith)!important}
    .profit-badge{background:var(--profit)!important}
    .copy-code{cursor:pointer;color:var(--primary);font-weight:700;font-size:.9rem}
    .hidden{display:none!important}
    .detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:1rem}
    .detail-box{border:1px solid var(--border);border-radius:14px;padding:.9rem;background:var(--bg)}

    /* ── Desktop table ── */
    .table{font-size:1rem}
    .table th{font-size:1rem;font-weight:800}
    .table td{vertical-align:middle}

    /* ── MOBILE layout ── */
    @media(max-width:767px){
      /* Metrics */
      .metric .v{font-size:1.4rem}
      .metric .l{font-size:.8rem}

      /* Hide desktop table, show card list */
      .desktop-table{display:none!important}
      .mobile-list{display:block!important}

      /* Scrollable modal info box */
      .detail-grid{grid-template-columns:repeat(2,1fr)}
      .modal-dialog{margin:.5rem}
    }

    /* ── DESKTOP: hide card list ── */
    @media(min-width:768px){
      .mobile-list{display:none!important}
      .desktop-table{display:block!important}
    }

    /* Mobile item cards */
    .mobile-list{display:none}
    .item-card{
      background:var(--card);border:1px solid var(--border);border-radius:16px;
      padding:1rem;margin-bottom:.75rem;box-shadow:var(--shadow)
    }
    .item-card .item-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.6rem}
    .item-card .item-name{font-weight:800;font-size:1rem;line-height:1.3}
    .item-card .item-code{font-size:.8rem;color:var(--primary);font-weight:700}
    .item-card .item-qty{font-size:1.1rem;font-weight:900;color:var(--text)}
    .item-card .item-weight{font-size:.82rem;color:var(--muted);margin-bottom:.6rem}
    .item-card .badges-row{display:flex;gap:.4rem;flex-wrap:wrap}
    .item-card .badge-label{font-size:.7rem;font-weight:700;color:var(--muted);margin-bottom:2px;text-transform:uppercase}
    .item-card .badge-group{display:flex;flex-direction:column;align-items:flex-start;min-width:0;flex:1}

    /* Horizontal scroll wrapper for desktop table on mobile (fallback) */
    .table-scroll-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

    /* ── Chart legends ── */
    .chart-wrap{display:flex;flex-direction:column}
    .chart-legend{padding:.5rem .8rem 1rem;display:flex;flex-direction:column;gap:5px}
    .legend-row{display:flex;align-items:center;gap:8px;font-size:.82rem;line-height:1.2}
    .legend-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
    .legend-label{flex:1;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .legend-val{font-weight:700;color:var(--muted);white-space:nowrap}
    .legend-pct{font-size:.78rem;color:var(--muted);white-space:nowrap}
  </style>
</head>
<body>
<div class='container-fluid py-3' style='max-width:1500px'>

  <div class='d-flex justify-content-between align-items-center mb-3 gap-2 flex-wrap'>
    <h4 class='fw-bold m-0'>💎 Gold Inventory Pro</h4>
    <div class='form-check form-switch'>
      <input id='theme' class='form-check-input' type='checkbox'>
      <label class='form-check-label'>Dark</label>
    </div>
  </div>

  <div id='drop' class='drop mb-3'>
    📁 Click or drop <b>gold_stock.db</b>
    <input id='file' type='file' accept='.db' hidden>
  </div>

  <section id='app' class='hidden'>
    <div class='sticky-topbar pb-2'>
      <input id='search' class='form-control form-control-lg mb-2' placeholder='Search code, name, smith...'>
      <div id='tags' class='tags'></div>
      <div class='form-check form-switch mt-1'>
        <input id='chartsToggle' class='form-check-input' type='checkbox'>
        <label class='form-check-label'>Show Analytics</label>
      </div>
    </div>

    <!-- Metrics -->
    <div class='row g-2 my-2'>
      <div class='col-6 col-md-3'><div class='cardx metric'><div class='l'>Unique</div><div id='u' class='v'>-</div></div></div>
      <div class='col-6 col-md-3'><div class='cardx metric'><div class='l'>Stock Qty</div><div id='q' class='v'>-</div></div></div>
      <div class='col-6 col-md-3'><div class='cardx metric'><div class='l'>Total Grams</div><div id='g' class='v'>-</div></div></div>
      <div class='col-6 col-md-3'><div class='cardx metric'><div class='l'>Burmese Weight</div><div id='bw' class='v'>-</div></div></div>
    </div>

    <!-- Charts -->
    <div id='charts' class='row g-3 my-2 hidden'>
      <div class='col-lg-4'><div class='cardx p-2 chart-wrap'><div id='c1'></div><div id='l1' class='chart-legend'></div></div></div>
      <div class='col-lg-4'><div class='cardx p-2 chart-wrap'><div id='c2'></div><div id='l2' class='chart-legend'></div></div></div>
      <div class='col-lg-4'><div class='cardx p-2 chart-wrap'><div id='c3'></div><div id='l3' class='chart-legend'></div></div></div>
    </div>

    <!-- Desktop Table -->
    <div class='cardx p-2 mt-3 desktop-table'>
      <div class='table-scroll-wrap'>
        <table class='table table-hover mb-0'>
          <thead>
            <tr>
              <th onclick="sortBy('item_name')">Item ⇅</th>
              <th onclick="sortBy('qty_on_hand')">Qty ⇅</th>
              <th onclick="sortBy('net_grams_total')">Total Gram ⇅</th>
              <th>Net</th>
              <th>Smith</th>
              <th>Profit</th>
            </tr>
          </thead>
          <tbody id='tbody'></tbody>
        </table>
      </div>
    </div>

    <!-- Mobile Card List -->
    <div id='mobile-list' class='mobile-list mt-3'></div>

  </section>
</div>

<!-- Detail Modal -->
<div class='modal fade' id='detailModal'>
  <div class='modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable'>
    <div class='modal-content p-4' style='max-height:90vh;overflow-y:auto' id='modalBody'></div>
  </div>
</div>

<script>
// ─── Constants ───────────────────────────────────────────────────────────────
// Myanmar gold weight system:
//   1 ကျပ် (kyat) = 16 ပဲ (pae)
//   1 ပဲ  (pae)  =  8 ရွေး (yway)
//   1 ကျပ်        = 128 ရွေး
//   1 ကျပ်        = 16.3296g  (official Myanmar gold standard)
const GRAM_PER_KYAT = 16.3296;
const GRAM_PER_PAE  = GRAM_PER_KYAT / 16;   // 1.02060g
const GRAM_PER_YWAY = GRAM_PER_PAE  / 8;    // 0.12757g

// ─── State ───────────────────────────────────────────────────────────────────
let db = null, data = [], selected = new Set(['All']), sort = {key:'net_grams_total', asc:false};

// ─── Helpers ─────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const debounce = (fn, d=250) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), d); }; };

/**
 * Convert ကျပ်/ပဲ/ရွေး values to total grams.
 * Handles fractional values in each field.
 */
function bwToGrams(kyat, pae, yway) {
  return (+kyat || 0) * GRAM_PER_KYAT
       + (+pae  || 0) * GRAM_PER_PAE
       + (+yway || 0) * GRAM_PER_YWAY;
}

/**
 * Convert grams to ကျပ်/ပဲ/ရွေး object.
 */
function gramsToBWParts(g) {
  if (!g || g <= 0) return { kyat: 0, pae: 0, yway: 0 };
  let rem = g;
  const kyat = Math.floor(rem / GRAM_PER_KYAT); rem -= kyat * GRAM_PER_KYAT;
  const pae  = Math.floor(rem / GRAM_PER_PAE);  rem -= pae  * GRAM_PER_PAE;
  const yway = rem / GRAM_PER_YWAY;
  return { kyat, pae, yway };
}

/**
 * Format grams as Burmese weight string.
 */
function gramsToBW(g) {
  const { kyat, pae, yway } = gramsToBWParts(g);
  const o = [];
  if (kyat) o.push(`${kyat} ကျပ်`);
  if (pae)  o.push(`${pae} ပဲ`);
  if (+yway.toFixed(1)) o.push(`${yway.toFixed(1)} ရွေး`);
  return o.join(' ') || '0';
}

/**
 * Format ကျပ်/ပဲ/ရွေး integer fields directly as a display string.
 */
function bw(k, p, y) {
  const o = [];
  if (+k) o.push(`${Math.floor(+k)} ကျပ်`);
  if (+p) o.push(`${Math.floor(+p)} ပဲ`);
  if (+y) o.push(`${(+y).toFixed(1)} ရွေး`);
  return o.join(' ') || '0';
}

/**
 * Net grams for one row = net weight (from ကျပ်/ပဲ/ရွေး) × qty_on_hand.
 * Falls back to weight_gram column if net BW fields are all zero.
 */
function netGramsPerUnit(r) {
  const fromBW = bwToGrams(r.Net_Kyat, r.Net_Pe, r.Net_Yway);
  if (fromBW > 0) return fromBW;
  // fallback: raw gram field
  return +r.weight_gram || 0;
}

function totalNetGrams(r) {
  return netGramsPerUnit(r) * (+r.qty_on_hand || 0);
}

const activeQty = r => (+r.qty_on_hand || 0) > 0;

function copyCode(c) { navigator.clipboard.writeText(c); }

// ─── DB Load ─────────────────────────────────────────────────────────────────
async function loadDB(file) {
  const SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${f}` });
  db = new SQL.Database(new Uint8Array(await file.arrayBuffer()));
  const stmt = db.prepare('SELECT * FROM items');
  data = [];
  const cats = new Set(['All']);
  while (stmt.step()) {
    const r = stmt.getAsObject();
    // Normalise net BW field names (handle different possible column names)
    r.Net_Kyat = r['Net (ကျပ်) Net_kyat'] ?? r['Net_kyat'] ?? r['net_kyat'] ?? 0;
    r.Net_Pe   = r['Net (ပဲ) Net_pae']    ?? r['Net_pae']  ?? r['net_pae']  ?? 0;
    r.Net_Yway = r['Net (ရွေး) Net_yway']  ?? r['Net_yway'] ?? r['net_yway'] ?? 0;
    // Pre-compute total net grams for sorting
    r.net_grams_total = totalNetGrams(r);
    data.push(r);
    if (r.category) cats.add(r.category);
  }
  $('tags').innerHTML = [...cats].map(c =>
    `<span class='tag ${c==='All'?'active':''}' onclick='setCat(${JSON.stringify(c)},this)'>${esc(c)}</span>`
  ).join('');
  $('drop').classList.add('hidden');
  $('app').classList.remove('hidden');
  render();
}

// ─── Category filter ─────────────────────────────────────────────────────────
function setCat(c, el) {
  if (c === 'All') {
    selected = new Set(['All']);
    document.querySelectorAll('.tag').forEach(x => x.classList.remove('active'));
    el.classList.add('active');
  } else {
    selected.delete('All');
    selected.has(c) ? (selected.delete(c), el.classList.remove('active'))
                    : (selected.add(c),    el.classList.add('active'));
    if (!selected.size) {
      selected = new Set(['All']);
      document.querySelectorAll('.tag')[0].classList.add('active');
    }
  }
  render();
}

// ─── Sort ────────────────────────────────────────────────────────────────────
function sortBy(k) {
  sort.asc = (sort.key === k) ? !sort.asc : false;
  sort.key = k;
  render();
}

// ─── Filter + Sort ───────────────────────────────────────────────────────────
function filtered() {
  const t = $('search').value.toLowerCase();
  return data
    .filter(i =>
      (selected.has('All') || selected.has(i.category)) &&
      (`${i.item_code} ${i.item_name} ${i.goldsmith_id}`.toLowerCase().includes(t))
    )
    .sort((a, b) => {
      const va = sort.key === 'net_grams_total' ? a.net_grams_total : a[sort.key];
      const vb = sort.key === 'net_grams_total' ? b.net_grams_total : b[sort.key];
      if (!isNaN(va) && !isNaN(vb)) return sort.asc ? +va - +vb : +vb - +va;
      return sort.asc ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
    });
}

// ─── Render ──────────────────────────────────────────────────────────────────
function render() {
  const rows = filtered();
  const activeRows = rows.filter(activeQty);
  const totalG = activeRows.reduce((s, r) => s + totalNetGrams(r), 0);

  $('u').textContent  = rows.length;
  $('q').textContent  = activeRows.reduce((s, r) => s + (+r.qty_on_hand || 0), 0);
  $('g').textContent  = totalG.toFixed(2);
  $('bw').textContent = gramsToBW(totalG);

  // ── Desktop rows ──
  $('tbody').innerHTML = rows.map(i => {
    const tg = totalNetGrams(i);
    return `<tr ondblclick='detail(${JSON.stringify(i.item_code)})'>
      <td>
        <b>${esc(i.item_name)}</b><br>
        <small class='copy-code' onclick='event.stopPropagation();copyCode(${JSON.stringify(i.item_code)})'>${esc(i.item_code)} 📋</small>
      </td>
      <td><span class='badge text-bg-secondary badge-pill'>${i.qty_on_hand || 0}</span></td>
      <td>
        ${activeQty(i) ? tg.toFixed(2) : '0.00'}g<br>
        <small>${activeQty(i) ? gramsToBW(tg) : '0'}</small>
      </td>
      <td><span class='badge badge-pill net-badge'>${bw(i.Net_Kyat, i.Net_Pe, i.Net_Yway)}</span></td>
      <td><span class='badge badge-pill smith-badge'>${bw(i.smith_wage_kyat, i.smith_wage_pe, i.smith_wage_ywe)}</span></td>
      <td><span class='badge badge-pill profit-badge'>${bw(i.sale_wage_profit_kyat, i.sale_wage_profit_pe, i.sale_wage_profit_ywe)}</span></td>
    </tr>`;
  }).join('');

  // ── Mobile cards ──
  $('mobile-list').innerHTML = rows.map(i => {
    const tg = totalNetGrams(i);
    return `<div class='item-card' ondblclick='detail(${JSON.stringify(i.item_code)})'>
      <div class='item-header'>
        <div>
          <div class='item-name'>${esc(i.item_name)}</div>
          <div class='item-code copy-code' onclick='event.stopPropagation();copyCode(${JSON.stringify(i.item_code)})'>${esc(i.item_code)} 📋</div>
        </div>
        <span class='badge text-bg-secondary' style='font-size:1rem;padding:.5rem .8rem'>${i.qty_on_hand || 0}</span>
      </div>
      <div class='item-weight'>
        ⚖️ ${activeQty(i) ? tg.toFixed(2) + 'g' : '0.00g'}&nbsp;&nbsp;${activeQty(i) ? gramsToBW(tg) : '0'}
      </div>
      <div class='badges-row'>
        <div class='badge-group'>
          <div class='badge-label'>Net</div>
          <span class='badge badge-pill net-badge'>${bw(i.Net_Kyat, i.Net_Pe, i.Net_Yway)}</span>
        </div>
        <div class='badge-group'>
          <div class='badge-label'>Smith</div>
          <span class='badge badge-pill smith-badge'>${bw(i.smith_wage_kyat, i.smith_wage_pe, i.smith_wage_ywe)}</span>
        </div>
        <div class='badge-group'>
          <div class='badge-label'>Profit</div>
          <span class='badge badge-pill profit-badge'>${bw(i.sale_wage_profit_kyat, i.sale_wage_profit_pe, i.sale_wage_profit_ywe)}</span>
        </div>
      </div>
    </div>`;
  }).join('');

  if (!$('charts').classList.contains('hidden')) drawCharts(activeRows);
}

// ─── Detail Modal ─────────────────────────────────────────────────────────────
function detail(code) {
  const i = data.find(x => x.item_code === code);
  if (!i) return;
  const tg = totalNetGrams(i);
  const rows = Object.entries(i).map(([k, v]) =>
    `<div class='detail-box'><small style='color:var(--muted)'>${esc(k)}</small><br><b style='font-size:1rem'>${esc(v)}</b></div>`
  ).join('');
  $('modalBody').innerHTML = `
    <h4>${esc(i.item_name)}</h4>
    <p><b>Code:</b> <span class='copy-code' onclick='copyCode(${JSON.stringify(i.item_code)})'>${esc(i.item_code)} 📋</span></p>
    <p><b>Net Weight (per unit):</b> ${netGramsPerUnit(i).toFixed(4)}g — ${gramsToBW(netGramsPerUnit(i))}</p>
    <p><b>Total Weight (×${i.qty_on_hand || 0}):</b> ${tg.toFixed(4)}g — ${gramsToBW(tg)}</p>
    <div class='table-scroll-wrap'><div class='detail-grid'>${rows}</div></div>`;
  new bootstrap.Modal($('detailModal')).show();
}

// ─── Charts ──────────────────────────────────────────────────────────────────
// Plotly color palette (consistent across charts)
const PALETTE = [
  '#2563eb','#d97706','#16a34a','#dc2626','#7c3aed','#0891b2',
  '#ea580c','#65a30d','#db2777','#0d9488','#92400e','#1d4ed8'
];

function makeLegend(elId, labels, values, unit='') {
  const total = values.reduce((a,b)=>a+b,0);
  $( elId).innerHTML = labels.map((lbl,i)=>{
    const pct = total>0 ? (values[i]/total*100).toFixed(1) : '0.0';
    const val = Number.isInteger(values[i]) ? values[i] : values[i].toFixed(2);
    return `<div class='legend-row'>
      <div class='legend-dot' style='background:${PALETTE[i%PALETTE.length]}'></div>
      <span class='legend-label' title='${lbl}'>${lbl}</span>
      <span class='legend-val'>${val}${unit}</span>
      <span class='legend-pct'>${pct}%</span>
    </div>`;
  }).join('');
}

function drawCharts(rows) {
  const textColor = getComputedStyle(document.documentElement).getPropertyValue('--text').trim();

  const BASE = {
    paper_bgcolor:'rgba(0,0,0,0)', plot_bgcolor:'rgba(0,0,0,0)',
    font:{size:13,color:textColor},
    margin:{t:48,l:30,r:30,b:20},
    showlegend:false
  };

  // ── C1: Bar — Qty by Category ──────────────────────────────────────────────
  const cats    = [...new Set(rows.map(x=>x.category||'Other'))];
  const qty     = cats.map(c=>rows.filter(x=>x.category===c).reduce((a,b)=>a+(+b.qty_on_hand||0),0));
  const weights = cats.map(c=>rows.filter(x=>x.category===c).reduce((a,b)=>a+totalNetGrams(b),0));

  Plotly.react('c1',
    [{
      x: cats, y: qty, type:'bar',
      marker:{color: cats.map((_,i)=>PALETTE[i%PALETTE.length])},
      text: qty.map(String), textposition:'outside',
      hovertemplate:'<b>%{x}</b><br>Qty: %{y}<extra></extra>',
      cliponaxis: false
    }],
    {
      ...BASE,
      height:300,
      title:{text:'Qty by Category',font:{size:15,weight:700}},
      yaxis:{showgrid:true,gridcolor:'rgba(128,128,128,.15)',zeroline:false,tickfont:{size:12}},
      xaxis:{tickfont:{size:11},tickangle:cats.length>5?-35:0},
      margin:{t:48,l:40,r:20,b: cats.length>5?80:40}
    }
  );
  makeLegend('l1', cats, qty);

  // ── C2: Donut — Weight by Category ────────────────────────────────────────
  Plotly.react('c2',
    [{
      labels: cats, values: weights, type:'pie', hole:.5,
      textinfo:'none',
      marker:{colors: cats.map((_,i)=>PALETTE[i%PALETTE.length])},
      hovertemplate:'<b>%{label}</b><br>%{value:.2f}g<br>%{percent}<extra></extra>'
    }],
    {
      ...BASE,
      height:280,
      title:{text:'Weight by Category',font:{size:15,weight:700}},
      margin:{t:48,l:10,r:10,b:10}
    }
  );
  makeLegend('l2', cats, weights, 'g');

  // ── C3: Donut — Qty by Goldsmith ──────────────────────────────────────────
  const smith    = [...new Set(rows.map(x=>x.goldsmith_id||'Unknown'))];
  const smithQty = smith.map(s=>rows.filter(x=>x.goldsmith_id===s).reduce((a,b)=>a+(+b.qty_on_hand||0),0));

  Plotly.react('c3',
    [{
      labels: smith, values: smithQty, type:'pie', hole:.5,
      textinfo:'none',
      marker:{colors: smith.map((_,i)=>PALETTE[i%PALETTE.length])},
      hovertemplate:'<b>%{label}</b><br>Qty: %{value}<br>%{percent}<extra></extra>'
    }],
    {
      ...BASE,
      height:280,
      title:{text:'Qty by Smith',font:{size:15,weight:700}},
      margin:{t:48,l:10,r:10,b:10}
    }
  );
  makeLegend('l3', smith, smithQty);
}

// ─── Event Bindings ───────────────────────────────────────────────────────────
$('drop').onclick   = () => $('file').click();
$('file').onchange  = e => e.target.files[0] && loadDB(e.target.files[0]);
$('search').oninput = debounce(render);
$('chartsToggle').onchange = e => { $('charts').classList.toggle('hidden', !e.target.checked); render(); };
$('theme').onchange = e => {
  document.documentElement.dataset.theme = e.target.checked ? 'dark' : 'light';
  localStorage.theme = document.documentElement.dataset.theme;
  render();
};

// Drag-and-drop support
const drop = $('drop');
drop.addEventListener('dragover', e => { e.preventDefault(); drop.style.borderColor='var(--primary)'; });
drop.addEventListener('dragleave', () => { drop.style.borderColor=''; });
drop.addEventListener('drop', e => { e.preventDefault(); drop.style.borderColor=''; const f=e.dataTransfer.files[0]; if(f)loadDB(f); });

// Restore theme
if (localStorage.theme === 'dark') {
  $('theme').checked = true;
  document.documentElement.dataset.theme = 'dark';
}
</script>
</body>
</html>
