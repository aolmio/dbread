<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Inventory Pro PWA</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #212529;
            --card-bg: #f8f9fa;
            --accent-smith: #FFB700;
            --accent-sale: #00E676;
        }

        [data-theme="dark"] {
            --bg-color: #0e1117;
            --text-color: #fafafa;
            --card-bg: #262730;
        }

        body { background-color: var(--bg-color); color: var(--text-color); transition: 0.3s; }
        .metric-card { background: var(--card-bg); padding: 20px; border-radius: 10px; text-align: center; border: 1px solid #4444; }
        .smith-text { color: var(--accent-smith); font-weight: bold; }
        .sale-text { color: var(--accent-sale); font-weight: bold; }
        #drop-area { border: 2px dashed #ccc; padding: 20px; text-align: center; margin-bottom: 20px; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>💍 Gold Inventory Pro</h1>
        <button id="theme-toggle" class="btn btn-outline-secondary">Toggle Mode</button>
    </div>

    <div id="drop-area">
        📁 Click or Drag & Drop <code>gold_stock.db</code> here
        <input type="file" id="db-upload" class="hidden" accept=".db">
    </div>

    <div id="dashboard" class="hidden">
        <div class="row mb-4">
            <div class="col"><input type="text" id="search-input" class="form-control" placeholder="🔍 Search Item Code, Goldsmith, or Name..."></div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-3"><div class="metric-card"><h6>Unique Items</h6><h3 id="m-unique">-</h3></div></div>
            <div class="col-md-3"><div class="metric-card"><h6>In-Stock Qty</h6><h3 id="m-qty">-</h3></div></div>
            <div class="col-md-3"><div class="metric-card"><h6>Net Weight</h6><h5 id="m-weight">-</h5></div></div>
            <div class="col-md-3"><div class="metric-card"><h6>Total Grams</h6><h3 id="m-grams">-</h3></div></div>
        </div>

        <div class="row mb-4">
            <div class="col-md-6"><div id="chart-cat"></div></div>
            <div class="col-md-6"><div id="chart-pie"></div></div>
        </div>

        <h3>📋 Product List</h3>
        <div class="table-responsive">
            <table class="table table-hover mt-3" id="item-table">
                <thead class="table-dark">
                    <tr>
                        <th>Code</th><th>Name</th><th>Qty</th><th>Net Weight</th><th>Grams</th><th>Smith Wage</th><th>Sale Profit</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let db = null;
    let fullData = [];

    // --- BURMESE WEIGHT LOGIC (REPLICATED FROM PY) ---
    function formatBurmeseWeight(k, p, y) {
        let parts = [];
        if (k > 0) parts.push(`${Math.floor(k)} ကျပ်`);
        if (p > 0) parts.push(`${Math.floor(p)} ပဲ`);
        if (y > 0) parts.push(`${y} ရွေး`);
        return parts.length > 0 ? parts.join(" ") : "0";
    }

    function getNormalizedTotals(data) {
        let tk = data.reduce((sum, r) => sum + (parseFloat(r.Net_Kyat) || 0), 0);
        let tp = data.reduce((sum, r) => sum + (parseFloat(r.Net_Pe) || 0), 0);
        let ty = data.reduce((sum, r) => sum + (parseFloat(r.Net_Yway) || 0), 0);

        let extra_p = Math.floor(ty / 8);
        let final_y = (ty % 8).toFixed(2);
        tp += extra_p;
        let extra_k = Math.floor(tp / 16);
        let final_p = Math.floor(tp % 16);
        let final_k = tk + extra_k;

        return `${final_k} ကျပ် ${final_p} ပဲ ${final_y} ရွေး`;
    }

    // --- DB HANDLING ---
    const config = { locateFile: filename => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${filename}` };
    
    document.getElementById('drop-area').onclick = () => document.getElementById('db-upload').click();
    
    document.getElementById('db-upload').onchange = async function(e) {
        const SQL = await initSqlJs(config);
        const f = e.target.files[0];
        const reader = new FileReader();
        reader.onload = function() {
            const Uints = new Uint8Array(reader.result);
            db = new SQL.Database(Uints);
            loadData();
        };
        reader.readAsArrayBuffer(f);
    };

    function loadData() {
        const res = db.exec("SELECT * FROM items");
        const columns = res[0].columns;
        const values = res[0].values;

        fullData = values.map(row => {
            let obj = {};
            columns.forEach((col, i) => {
                // Rename logic from Streamlit
                let key = col;
                if(col === 'Net (ကျပ်) Net_kyat') key = 'Net_Kyat';
                if(col === 'Net (ပဲ) Net_pae') key = 'Net_Pe';
                if(col === 'Net (ရွေး) Net_yway') key = 'Net_Yway';
                obj[key] = row[i];
            });
            return obj;
        });

        document.getElementById('dashboard').classList.remove('hidden');
        renderDashboard(fullData);
    }

    function renderDashboard(data) {
        // Metrics
        document.getElementById('m-unique').innerText = data.length;
        document.getElementById('m-qty').innerText = data.reduce((s, r) => s + (r.qty_on_hand || 0), 0);
        document.getElementById('m-weight').innerText = getNormalizedTotals(data);
        document.getElementById('m-grams').innerText = data.reduce((s, r) => s + (parseFloat(r.weight_gram) || 0), 0).toFixed(3) + " g";

        // Table
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';
        data.forEach(item => {
            const row = `<tr>
                <td>${item.item_code}</td>
                <td>${item.item_name}</td>
                <td>${item.qty_on_hand}</td>
                <td>${formatBurmeseWeight(item.Net_Kyat, item.Net_Pe, item.Net_Yway)}</td>
                <td>${item.weight_gram}</td>
                <td class="smith-text">${formatBurmeseWeight(item.smith_wage_kyat, item.smith_wage_pe, item.smith_wage_ywe)}</td>
                <td class="sale-text">${formatBurmeseWeight(item.sale_wage_profit_kyat, item.sale_wage_profit_pe, item.sale_wage_profit_ywe)}</td>
            </tr>`;
            tbody.innerHTML += row;
        });

        renderCharts(data);
    }

    function renderCharts(data) {
        // Simple Chart.js or Plotly logic
        const categories = [...new Set(data.map(i => i.category))];
        const qtyData = categories.map(c => data.filter(i => i.category === c).reduce((s, r) => s + r.qty_on_hand, 0));

        Plotly.newPlot('chart-cat', [{
            x: categories, y: qtyData, type: 'bar', marker: {color: '#FFB700'}
        }], { title: 'Qty by Category', paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)', font: {color: '#888'} });
    }

    // Search Filter
    document.getElementById('search-input').oninput = function(e) {
        const val = e.target.value.toLowerCase();
        const filtered = fullData.filter(i => 
            String(i.item_code).toLowerCase().includes(val) || 
            String(i.item_name).toLowerCase().includes(val) ||
            String(i.goldsmith_id).toLowerCase().includes(val)
        );
        renderDashboard(filtered);
    };

    // Theme Toggle
    const btn = document.getElementById('theme-toggle');
    btn.onclick = () => {
        const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
    };
</script>
</body>
</html>
