<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gold Inventory Pro PWA</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #f4f7f6;
            --bg-card: #ffffff;
            --text-main: #2d3436;
            --accent-smith: #d35400; 
            --accent-sale: #27ae60;  
            --border-color: #dfe6e9;
        }

        [data-theme="dark"] {
            --bg-body: #0e1117;
            --bg-card: #1d2127;
            --text-main: #e1e1e1;
            --border-color: #30363d;
            --accent-smith: #ffb700;
            --accent-sale: #00e676;
        }

        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            transition: all 0.3s ease;
            padding-bottom: 50px;
        }

        .metric-card {
            background: var(--bg-card);
            padding: 1.2rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            height: 100%;
        }

        .metric-value { font-size: 1.2rem; font-weight: 700; }
        .metric-label { font-size: 0.75rem; opacity: 0.7; text-transform: uppercase; }

        .search-container { position: sticky; top: 0; z-index: 100; background: var(--bg-body); padding: 10px 0; border-bottom: 1px solid var(--border-color); }
        .table-container { background: var(--bg-card); border-radius: 8px; border: 1px solid var(--border-color); }
        
        .smith-text { color: var(--accent-smith); font-weight: 600; font-size: 0.85rem; }
        .sale-text { color: var(--accent-sale); font-weight: 600; font-size: 0.85rem; }

        #drop-area {
            border: 2px dashed #999;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            background: var(--bg-card);
            cursor: pointer;
        }

        .sortable { cursor: pointer; color: #007bff; text-decoration: underline; }
        .hidden { display: none !important; }
        
        /* Fixed Column Widths for Readability */
        th { font-size: 0.8rem; text-transform: uppercase; }
        td { font-size: 0.85rem; vertical-align: middle; }
    </style>
</head>
<body>

<div class="container-fluid py-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">💍 Gold Pro</h4>
        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="theme-switch">
        </div>
    </div>

    <div id="drop-area" class="mb-4">
        <p class="mb-0">📁 Tap to Upload <code>gold_stock.db</code></p>
        <input type="file" id="db-upload" class="hidden" accept=".db">
    </div>

    <div id="app-content" class="hidden">
        <div class="search-container mb-3">
            <div class="row g-2">
                <div class="col-8">
                    <input type="text" id="search-input" class="form-control" placeholder="Search Code, Name, Category...">
                </div>
                <div class="col-4 text-end">
                    <div class="form-check form-switch d-inline-block pt-2">
                        <input class="form-check-input" type="checkbox" id="chart-toggle">
                        <label class="form-check-label d-none d-sm-inline" for="chart-toggle">Charts</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-2 mb-3">
            <div class="col-4 col-md-2">
                <div class="metric-card text-center">
                    <div class="metric-label">Items</div>
                    <div class="metric-value" id="m-unique">-</div>
                </div>
            </div>
            <div class="col-8 col-md-10">
                <div class="metric-card">
                    <div class="metric-label">Total Weight</div>
                    <div class="metric-value" id="m-weight">-</div>
                </div>
            </div>
        </div>

        <div id="chart-section" class="row g-2 mb-3 hidden">
            <div class="col-md-6"><div class="metric-card"><div id="chart-cat"></div></div></div>
            <div class="col-md-6"><div class="metric-card"><div id="chart-pie"></div></div></div>
        </div>

        <div class="table-container">
            <div class="table-responsive">
                <table class="table table-sm table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Item Info</th>
                            <th>Qty</th>
                            <th class="sortable" id="sort-gram">Grams ↕</th>
                            <th>Net (B)</th>
                            <th>Smith</th>
                            <th>Sale</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    let db = null;
    let fullData = [];
    let sortAsc = false;

    function formatBurmeseWeight(k, p, y) {
        let parts = [];
        if (k > 0) parts.push(`${Math.floor(k)}k`);
        if (p > 0) parts.push(`${Math.floor(p)}p`);
        if (y > 0) parts.push(`${y}y`);
        return parts.length > 0 ? parts.join(" ") : "0";
    }

    function getNormalizedTotals(data) {
        let tk = data.reduce((s, r) => s + (parseFloat(r.Net_Kyat) || 0), 0);
        let tp = data.reduce((s, r) => s + (parseFloat(r.Net_Pe) || 0), 0);
        let ty = data.reduce((s, r) => s + (parseFloat(r.Net_Yway) || 0), 0);
        tp += Math.floor(ty / 8);
        let fy = (ty % 8).toFixed(2);
        tk += Math.floor(tp / 16);
        let fp = Math.floor(tp % 16);
        return `${Math.floor(tk)} ကျပ် ${fp} ပဲ ${fy} ရွေး`;
    }

    const config = { locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}` };
    document.getElementById('drop-area').onclick = () => document.getElementById('db-upload').click();
    
    document.getElementById('db-upload').onchange = async function(e) {
        const SQL = await initSqlJs(config);
        const reader = new FileReader();
        reader.onload = function() {
            db = new SQL.Database(new Uint8Array(reader.result));
            processDatabase();
            document.getElementById('drop-area').classList.add('hidden');
            document.getElementById('app-content').classList.remove('hidden');
        };
        reader.readAsArrayBuffer(e.target.files[0]);
    };

    function processDatabase() {
        const stmt = db.prepare("SELECT * FROM items");
        fullData = [];
        while(stmt.step()) {
            let row = stmt.getAsObject();
            fullData.push({
                ...row,
                Net_Kyat: row['Net (ကျပ်) Net_kyat'] || 0,
                Net_Pe: row['Net (ပဲ) Net_pae'] || 0,
                Net_Yway: row['Net (ရွေး) Net_yway'] || 0,
                weight_gram: parseFloat(row['weight_gram']) || 0,
                category: String(row['category'] || 'General')
            });
        }
        render(fullData);
    }

    function render(data) {
        document.getElementById('m-unique').innerText = data.length;
        document.getElementById('m-weight').innerText = getNormalizedTotals(data);

        const tbody = document.getElementById('table-body');
        tbody.innerHTML = data.map(item => `
            <tr>
                <td>
                    <strong>${item.item_code}</strong><br>
                    <span class="badge bg-secondary" style="font-size: 0.6rem;">${item.category}</span>
                </td>
                <td>${item.qty_on_hand}</td>
                <td><strong>${item.weight_gram.toFixed(2)}</strong></td>
                <td><small>${formatBurmeseWeight(item.Net_Kyat, item.Net_Pe, item.Net_Yway)}</small></td>
                <td class="smith-text">${formatBurmeseWeight(item.smith_wage_kyat, item.smith_wage_pe, item.smith_wage_ywe)}</td>
                <td class="sale-text">${formatBurmeseWeight(item.sale_wage_profit_kyat, item.sale_wage_profit_pe, item.sale_wage_profit_ywe)}</td>
            </tr>
        `).join('');

        if(!document.getElementById('chart-section').classList.contains('hidden')) {
            renderCharts(data);
        }
    }

    function renderCharts(data) {
        const cats = [...new Set(data.map(i => i.category))];
        const qtyVals = cats.map(c => data.filter(i => i.category === c).reduce((s, r) => s + r.qty_on_hand, 0));
        const theme = document.documentElement.getAttribute('data-theme');
        const textColor = theme === 'dark' ? '#fff' : '#333';

        const layout = { 
            height: 220, margin: {t:30, b:30, l:30, r:10}, 
            paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
            font: { color: textColor, size: 9 }
        };

        Plotly.newPlot('chart-cat', [{ x: cats, y: qtyVals, type: 'bar', marker: {color: '#d35400'} }], { ...layout, title: 'Category Qty' });
        Plotly.newPlot('chart-pie', [{ values: qtyVals, labels: cats, type: 'pie', hole: 0.4 }], { ...layout, title: 'Distribution' });
    }

    // --- SEARCH & SORT LOGIC ---
    document.getElementById('search-input').oninput = (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = fullData.filter(i => 
            String(i.item_code).toLowerCase().includes(term) || 
            String(i.item_name).toLowerCase().includes(term) ||
            String(i.category).toLowerCase().includes(term)
        );
        render(filtered);
    };

    document.getElementById('sort-gram').onclick = () => {
        sortAsc = !sortAsc;
        const sorted = [...fullData].sort((a, b) => sortAsc ? a.weight_gram - b.weight_gram : b.weight_gram - a.weight_gram);
        render(sorted);
    };

    document.getElementById('chart-toggle').onchange = (e) => {
        document.getElementById('chart-section').classList.toggle('hidden', !e.target.checked);
        if(e.target.checked) renderCharts(fullData);
    };

    document.getElementById('theme-switch').onchange = (e) => {
        document.documentElement.setAttribute('data-theme', e.target.checked ? 'dark' : 'light');
        if(fullData.length > 0) renderCharts(fullData);
    };
</script>
</body>
</html>
