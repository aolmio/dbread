<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Inventory Pro</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://sql.js.org/dist/sql-wasm.js"></script>
    <style>
        :root {
            --bg: #ffffff; --text: #212529; --card: #ffffff; --border: #dee2e6;
            --weight-hi: #007bff; --smith-hi: #f39c12; --profit-hi: #27ae60;
        }
        [data-theme="dark"] {
            --bg: #121212; --text: #e0e0e0; --card: #1e1e1e; --border: #333;
            --weight-hi: #64d2ff; --smith-hi: #ff9f0a; --profit-hi: #32d74b;
        }
        body { background: var(--bg); color: var(--text); transition: 0.3s; font-family: sans-serif; }
        .metric-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; text-align: center; }
        .hi-weight { color: var(--weight-hi); font-weight: 800; }
        .hi-smith { color: var(--smith-hi); font-weight: 800; }
        .hi-profit { color: var(--profit-hi); font-weight: 800; }
        .sticky-nav { position: sticky; top: 0; background: var(--bg); z-index: 1000; border-bottom: 1px solid var(--border); padding: 10px 0; }
        
        /* Mobile Card UI */
        @media (max-width: 768px) {
            thead { display: none; }
            tr { display: block; background: var(--card); border: 1px solid var(--border); margin-bottom: 15px; border-radius: 10px; padding: 10px; }
            td { display: flex; justify-content: space-between; border: none !important; padding: 5px 0 !important; }
            td::before { content: attr(data-label); font-weight: bold; opacity: 0.7; }
        }
    </style>
</head>
<body>

<div class="container-fluid px-3">
    <nav class="sticky-nav mb-3">
        <div class="d-flex justify-content-between align-items-center">
            <h5 class="m-0">💍 Gold Pro</h5>
            <div class="d-flex gap-2">
                <button id="themeBtn" class="btn btn-sm btn-outline-secondary">🌙 Mode</button>
                <input type="file" id="dbFile" class="form-control form-control-sm" style="width: 130px;" accept=".db">
            </div>
        </div>
    </nav>

    <div id="setup" class="text-center py-5">
        <p class="text-muted">Upload your <b>.db</b> file to activate the dashboard.</p>
    </div>

    <div id="mainApp" style="display:none;">
        <div class="row g-2 mb-3">
            <div class="col-6"><div class="metric-card"><small>Total Items</small><div id="m-items" class="h5 m-0">-</div></div></div>
            <div class="col-6"><div class="metric-card"><small>Total Grams</small><div id="m-grams" class="h5 m-0 hi-weight">-</div></div></div>
            <div class="col-12"><div class="metric-card"><small>Net Weight (Burmese)</small><div id="m-burmese" class="h6 m-0">-</div></div></div>
        </div>

        <div class="row g-2 mb-3">
            <div class="col-7"><input type="text" id="search" class="form-control" placeholder="🔍 Search code/name..."></div>
            <div class="col-5">
                <select id="sort" class="form-select">
                    <option value="item_code">Sort: Code</option>
                    <option value="weight_gram">Sort: Weight</option>
                    <option value="qty_on_hand">Sort: Qty</option>
                </select>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table align-middle">
                <thead class="table-light">
                    <tr><th>Item</th><th>Qty</th><th>Weight</th><th>Smith</th><th>Profit</th></tr>
                </thead>
                <tbody id="list"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
let rawData = [];
let SQL = null;

// Initialization
initSqlJs({ locateFile: f => `https://sql.js.org/dist/${f}` }).then(s => SQL = s);

// Theme Toggle
document.getElementById('themeBtn').onclick = () => {
    const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', theme);
    document.getElementById('themeBtn').innerText = theme === 'dark' ? '☀️ Day' : '🌙 Night';
};

// Database Loading
document.getElementById('dbFile').onchange = (e) => {
    const reader = new FileReader();
    reader.onload = function() {
        const db = new SQL.Database(new Uint8Array(reader.result));
        const res = db.exec("SELECT * FROM burmese_table");
        if (!res.length) return alert("Table not found!");

        const rows = res[0].values;
        const headers = rows[8]; // Matches Python header_idx = 8
        
        rawData = rows.slice(9).map(r => {
            let obj = {};
            headers.forEach((h, i) => {
                let key = String(h).trim();
                // Normalize Burmese Column names
                if (key.includes("Net_kyat")) key = "Net_Kyat";
                if (key.includes("Net_pae")) key = "Net_Pe";
                if (key.includes("Net_yway")) key = "Net_Yway";
                obj[key] = r[i];
            });
            return obj;
        });

        document.getElementById('setup').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        updateUI();
    };
    reader.readAsArrayBuffer(e.target.files[0]);
};

// Burmese Weight Formatter
function fmtB(k, p, y) {
    let parts = [];
    if (k > 0) parts.push(`${Math.floor(k)}k`);
    if (p > 0) parts.push(`${Math.floor(p)}p`);
    if (y > 0) parts.push(`${Number(y).toFixed(1)}y`);
    return parts.length ? parts.join(" ") : "0";
}

// Logic to calculate normalized totals
function calcTotals(data) {
    let tk = data.reduce((a, b) => a + (Number(b.Net_Kyat) || 0), 0);
    let tp = data.reduce((a, b) => a + (Number(b.Net_Pe) || 0), 0);
    let ty = data.reduce((a, b) => a + (Number(b.Net_Yway) || 0), 0);
    tp += Math.floor(ty / 8);
    ty = (ty % 8).toFixed(2);
    tk += Math.floor(tp / 16);
    tp = Math.floor(tp % 16);
    return `${tk} ကျပ် ${tp} ပဲ ${ty} ရွေး`;
}

// Core Update Function (Sorting/Filtering/Rendering)
function updateUI() {
    let filtered = rawData.filter(i => 
        JSON.stringify(i).toLowerCase().includes(document.getElementById('search').value.toLowerCase())
    );

    const sortBy = document.getElementById('sort').value;
    filtered.sort((a, b) => {
        let v1 = a[sortBy], v2 = b[sortBy];
        return isNaN(v1) ? String(v1).localeCompare(String(v2)) : v2 - v1;
    });

    // Metrics
    document.getElementById('m-items').innerText = filtered.length;
    document.getElementById('m-grams').innerText = filtered.reduce((a,b)=>a+(Number(b.weight_gram)||0),0).toFixed(2) + " g";
    document.getElementById('m-burmese').innerText = calcTotals(filtered);

    // List Rendering with High Contrast Colors
    document.getElementById('list').innerHTML = filtered.map(i => `
        <tr>
            <td data-label="Item"><b>${i.item_code}</b><br><small>${i.item_name}</small></td>
            <td data-label="Qty">${i.qty_on_hand}</td>
            <td data-label="Weight" class="hi-weight">${fmtB(i.Net_Kyat, i.Net_Pe, i.Net_Yway)}</td>
            <td data-label="Smith" class="hi-smith">${fmtB(i.smith_wage_kyat, i.smith_wage_pe, i.smith_wage_ywe)}</td>
            <td data-label="Profit" class="hi-profit">${fmtB(i.sale_wage_profit_kyat, i.sale_wage_profit_pe, i.sale_wage_profit_ywe)}</td>
        </tr>
    `).join('');
}

document.getElementById('search').oninput = updateUI;
document.getElementById('sort').onchange = updateUI;
</script>
</body>
</html>
